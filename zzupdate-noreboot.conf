## https://github.com/TurboLabIt/zzupdate/blob/master/zzupdate-noreboot.conf
##
## "zzupdate noreboot": the usual update, but no reboot at the end, whatever /etc/turbolab.it/zzupdate.conf says.
## For a caller which takes care of the reboot on its own, i.e. multissh's update task:
## https://github.com/TurboLabIt/multissh/blob/main/ops-center/remote/update-remote.sh
REBOOT=0
