## https://github.com/TurboLabIt/zzupdate/blob/master/zzupdate.default.conf

REBOOT=1
REBOOT_TIMEOUT=15
## seconds to wait before the final reboot, on top of REBOOT_TIMEOUT. >0: it's scheduled in background, the script doesn't wait for it
REBOOT_DELAY=0
## 1: the maintainer's config file always wins, with no prompt: it overwrites the local one (kept as *.dpkg-old) and it's put back if deleted
KEEP_MAINTAINER_CONFIG_FILES=1
VERSION_UPGRADE=1
VERSION_UPGRADE_SILENT=0
FIRMWARE_UPGRADE=1
COMPOSER_UPGRADE=1
OLLAMA_MODELS_UPDATE=1
NGINX_SIGN_KEY_UPDATE=1
MYSQL_SIGN_KEY_UPDATE=1
SWITCH_PROMPT_TO_NORMAL=0
ADDITIONAL_UPDATE_SCRIPT=
